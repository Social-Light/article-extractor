{% extends 'base.html' %}

{% block title %}Edit Publisher - Social Light{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="section-card">
            <div class="section-header">
                <i class="fas fa-edit"></i> Edit Publisher
            </div>
            <div class="p-3">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Publisher Name</label>
                        <input type="text" name="name" class="form-control" value="{{ publisher.name }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Base AVE Rate (Pula)</label>
                        <input type="number" name="base_ave_rate" class="form-control" step="0.01" value="{{ publisher.base_ave_rate }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Reach</label>
                        <input type="number" name="reach" class="form-control" step="1000" value="{{ publisher.reach }}" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Update Publisher
                    </button>
                    <a href="{% url 'organisations:publishers' %}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
